[project]
name = "flowlite"
dynamic = ["version"]
description = "Local, free, cross-platform speech-to-text. Press a hotkey, speak, text appears where your cursor is."
requires-python = ">=3.10,<3.14"
dependencies = [
    "PySide6>=6.7",
    # Primary engine: Metal on Apple Silicon, CPU elsewhere. Ships wheels for
    # macOS arm64, Windows and Linux, so nothing has to be compiled.
    "pywhispercpp>=1.5.1",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "pynput>=1.7.7",
    "huggingface-hub>=0.26",
]

[project.optional-dependencies]
# Fallback engine. Only needed on Intel Macs (no whisper.cpp wheel) or to use
# an NVIDIA GPU via CUDA. Pulls in ~138 MB of onnxruntime/av/tokenizers, so it
# stays out of the shipped bundle.
ct2 = ["faster-whisper>=1.1.0"]
dev = ["pytest>=8.0", "pyinstaller>=6.10"]

[project.scripts]
flowlite = "flowlite.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "flowlite/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["flowlite"]
